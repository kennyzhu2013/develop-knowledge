server: 
   port: 9283
   address: {{ip}}
   tomcat:
     max-connections: 10000
     max-threads: 1000

rocketmq:
  #生产者配置
  producer:
    endpoints: {{rocketmqIps}}
    access-key: {{rocketmqAccess}}
    secret-key: {{rocketmqSecret}}
  push-consumer:
    access-key: {{rocketmqAccess}}
    secret-key: {{rocketmqSecret}}
    endpoints: {{rocketmqIps}}



spring:
  datasource:
    dynamic:
      primary: user_qc
      datasource:
        user_qc:
          url: jdbc:mysql://{{db_auth}}/user_qc?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
          username: {{db_auth_username}}
          password: {{db_auth_password}}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource  # 这行没有冒号结尾
          druid: # 对齐到type的层级
            initial-size: 1
            min-idle: 5
            max-active: 50
            max-wait: 1000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
        dcc_conf:
          url: jdbc:mysql://{{db_conf}}/dcc_conf?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
          username: {{db_conf_username}}
          password: {{db_donf_password}}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource  # 这行没有冒号结尾
          druid: # 对齐到type的层级
            initial-size: 1
            min-idle: 5
            max-active: 50
            max-wait: 1000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false
        vi_bill:
          url: jdbc:mysql://{{db_bill}}/vi_bill?characterEncoding=utf8&amp&useSSL=false
          username: {{db_bill_username}}
          password: {{db_bill_password}}
          driver-class-name: com.mysql.cj.jdbc.Driver
          type: com.alibaba.druid.pool.DruidDataSource  # 这行没有冒号结尾
          druid: # 对齐到type的层级
            initial-size: 1
            min-idle: 5
            max-active: 50
            max-wait: 1000
            validation-query: SELECT 1
            test-while-idle: true
            test-on-borrow: false
            test-on-return: false

