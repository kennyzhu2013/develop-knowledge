# 知识库总索引。Agent 首先读取本文件（或通过 tools/kb_route.py 使用它）。
# 所有 path 均相对仓库根目录；目录会被展开为其中的 .md / .yaml 文件，并按文档 frontmatter 的 audience 过滤。
version: 1

# ---------------------------------------------------------------------------
# 角色：所有角色共用同一套知识，只是入口、默认加载内容和可用 Skill 不同。
# ---------------------------------------------------------------------------
roles:
  architect:
    name: 技术架构师
    entry: roles/architect.md
    always_load:
      - 00-context/business-overview.md
      - 04-architecture/overall.md
    focus: [architecture, decision, dependency, nonfunctional]
    skills: [understand-system, architecture-review, impact-analysis]
  developer:
    name: 研发工程师
    entry: roles/developer.md
    always_load:
      - 00-context/glossary.md
      - 08-development/coding.md
    focus: [business-flow, code, api, data, test]
    skills: [understand-system, impact-analysis, modify-api, modify-mq, modify-database, add-qc-rule, add-fraud-pattern]
  ops:
    name: 运维人员
    entry: roles/ops.md
    always_load:
      - 07-operation/deployment.md
      - 07-operation/monitoring.md
    focus: [runtime, alert, runbook, incident]
    skills: [troubleshoot, release-check]
  qa:
    name: 测试工程师
    entry: roles/qa.md
    always_load:
      - 00-context/glossary.md
      - 08-development/testing.md
    focus: [business-rule, sample, test, regression]
    skills: [add-qc-rule, add-fraud-pattern, release-check]

# ---------------------------------------------------------------------------
# 业务/技术域
# ---------------------------------------------------------------------------
domains:
  context:
    name: 全局上下文
    paths: [00-context/]
  mid_number:
    name: 700 号码专线接入与话务管控（中间号域）
    paths: [01-mid-number/]
    services: [vi-as, vi-cront-jobs]
  call_qc:
    name: 专线语音质检
    paths: [02-call-qc/]
    services: [vi-media, vi-merge, offline-merge, vi-billcenter, vi-pusher, qa-server]
  ai:
    name: AI 能力（质检编排与模型）
    paths: [03-ai/]
    services: [scheduler]
  architecture:
    name: 系统架构
    paths: [04-architecture/]
  code:
    name: 代码知识
    paths: [05-code/]
  data:
    name: 数据与接口
    paths: [06-data/]
  operation:
    name: 运行运维
    paths: [07-operation/]
  development:
    name: 研发规范
    paths: [08-development/]
  decisions:
    name: 架构决策
    paths: [09-decisions/]
  lessons:
    name: 经验与故障
    paths: [10-lessons/]

# ---------------------------------------------------------------------------
# 服务清单：每个服务在 05-code/services/<name>.yaml 有一份描述，源码在 vi-assets/<repo>-master/。
# ---------------------------------------------------------------------------
services:
  - vi-as
  - vi-media
  - vi-merge
  - offline-merge
  - vi-billcenter
  - vi-pusher
  - qa-server
  - scheduler
  - vi-cront-jobs

# ---------------------------------------------------------------------------
# 外部系统：在链路上、但源码不在本知识库中。服务 YAML 的 dependencies.external 与架构图节点可以引用。
# ---------------------------------------------------------------------------
external_systems:
  - { name: ims, desc: "IMS 核心网（S-CSCF / I-CSCF），专线呼叫来源与出呼路由" }
  - { name: xproxy, desc: "7001 前缀统一入口（前缀 / 实体卡方案），把专线呼叫送到 vi-as" }
  - { name: xsipproxy, desc: "SIP 出呼代理（ETCD com.cmic.xsipproxy，Route tag internal-as）" }
  - { name: strategy-service, desc: "话务管控策略服务（ETCD com.cmic.vi.strategy，HTTP /strategy），推测读取 vi-cront-jobs 写的 Redis 管控 key" }
  - { name: vi-codec, desc: "实时转码：收 vi-media WebSocket 帧，解码为 PCM 经 WebSocket 推给 vi-merge" }
  - { name: vi-mdown, desc: "录音文件上传 / 下载服务（Xcache，ETCD vii/com.cmic.vi.mdownload），落 PFS" }
  - { name: pfs, desc: "录音文件存储" }
  - { name: cdn, desc: "放音文件服务（ETCD com.cmic.cdn），从 PFS 拉放音文件" }
  - { name: tts, desc: "文本转语音（outbound 应用 /media/voice/tts）" }
  - { name: httpproxy, desc: "对外 HTTP 代理（POST /proxy，目标在 X-Forwarded-For），vi-pusher 经它推送客户" }
  - { name: customer-system, desc: "质检客户的结果接收系统（customer_tab.result_push_url）" }
  - { name: ops-platform, desc: "对客质检统一运营平台：维护 user_qc 配置并递增 ETCD 版本 key（推断）" }
  - { name: xpusher, desc: "准实时质检话单推送方（RabbitMQ from_xpusher_queue），不在现有源码中" }
  - { name: asr, desc: "ASR / 九天 ASR 模型适配器（RabbitMQ scheduler.asr.*），按 fileUrl 拉录音" }
  - { name: ai-models, desc: "其余模型适配器：关键词反诈、融通、BGE、重庆反诈 / agent、DeepSeek、通义千问、RAG、DIFY、声纹、鉴伪等" }

# ---------------------------------------------------------------------------
# 任务路由：关键词命中 → 最小知识集。by_role 是在通用 load 之外，该角色额外需要的内容。
# 关键词大小写不敏感；按命中数排序，取前 max_routes 条合并。
# ---------------------------------------------------------------------------
router:
  max_routes: 3
  max_files: 20

routes:
  - id: number-700
    keywords: ["700", "7001", "700号码", "专线", "号码授权", "报备", "biz_num_auth"]
    load:
      - 01-mid-number/700/overview.md
      - 01-mid-number/number-pool/overview.md
      - 05-code/services/vi-as.yaml
    by_role:
      developer: [05-code/modules/vi-as.md, 06-data/api/reporting-interface-v1.0.1.md]
      qa: [06-data/api/reporting-interface-v1.0.1.md]
      architect: [00-context/system-boundary.md]
    skills: [understand-system, impact-analysis]

  - id: call-routing
    keywords: ["vi-as", "sip", "信令", "invite", "b2bua", "呼叫", "接续", "603", "路由", "xproxy", "startmode"]
    load:
      - 01-mid-number/call-routing/overview.md
      - 05-code/services/vi-as.yaml
      - 10-lessons/pitfalls/known-issues-vi-as.md
    by_role:
      developer: [05-code/modules/vi-as.md, 06-data/api/vi-as-to-vi-media.md]
      ops: [07-operation/runbooks/, 07-operation/emergency/overview.md]
    skills: [understand-system, troubleshoot]

  - id: traffic-control
    keywords: ["话务管控", "管控", "策略", "拦截", "高频", "长通话", "非工作时间", "append_reason", "vi-cront-jobs", "strategy"]
    load:
      - 01-mid-number/traffic-control/
      - 05-code/services/vi-cront-jobs.yaml
    by_role:
      developer: [05-code/modules/vi-cront-jobs.md, 06-data/redis/keys.yaml, 06-data/api/strategy-service.md]
      ops: [07-operation/runbooks/]
    skills: [impact-analysis]

  - id: bill
