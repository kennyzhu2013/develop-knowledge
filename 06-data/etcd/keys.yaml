meta:
  id: data-etcd-keys
  title: ETCD Key
  domain: data
  kind: dynamic
  audience: [developer, ops]
  owner: TODO
  status: draft
  last_verified: 2026-10-15
  source_of_truth:
    - vi-assets/vi-as-master/src/main/java/com/cmic/config/ConstantConf.java
    - vi-assets/vi-media-master/internal/pkg/kv/registry/registry.go
    - vi-assets/qa-server-master/utils/etcd.py
  related: [arch-middleware, data-overview, svc-vi-as]

# 不写集群地址。服务注册的实例 key 含主机和端口，这里只记前缀。
keys:
  - name: /config/version
    type: 版本通知
    ttl: 无
    writer: ops-platform
    reader: vi-as, vi-billcenter, vi-pusher
    purpose: 企业、客户、渠道配置变更后触发内存重载
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/ConstantConf.java
  - name: /config/num/version
    type: 版本通知
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 号码报备变更后重载精确号码与前缀
    source: vi-assets/vi-as-master/src/main/java/com/cmic/service/AuthConfigService.java
  - name: /config/phone_segment/version
    type: 版本通知
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 号段表版本。另有 /config/phone_segment_version
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/ConstantConf.java
  - name: /config/china_mobile_icscf/version
    type: 版本通知
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: ICSCF 区号表版本。另有 /config/chinamobile_icscf_areacode_version
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/ConstantConf.java
  - name: /config/max_sessions
    type: 配置
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 最大会话数。key 缺失时初始化会空指针
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/DevHelp.java
  - name: /config/audit_strategy_allow
    type: 开关
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 是否在呼叫时查询 strategy-service。关闭时跳过策略
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/DevHelp.java
  - name: /config/supported_codec
    type: 配置
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: SDP 允许的编解码
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/DevHelp.java
  - name: /config/db_oper_reject_ratio
    type: 配置
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 话单异步入库并发拒绝比例
    source: vi-assets/vi-as-master/src/main/java/com/cmic/service/DbAsyncService.java
  - name: /config/publish_rocketmq_thread_pool
    type: 配置
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 话单 MQ 发布线程池
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/DevHelp.java
  - name: /config/analyse_abnormal_bill/case1_switch
    type: 开关
    ttl: 无
    writer: ops-platform
    reader: vi-as
    purpose: 异常话单分析 case1 到 case7，路径中的序号替换 1
    source: vi-assets/vi-as-master/src/main/java/com/cmic/config/ConstantConf.java
  - name: ETCD_CONFIG.config_key
    type: 版本通知
    ttl: 无
    writer: qa-server
    reader: qa-server
    purpose: 客户、词包、话术、企业变更。值为时间戳。具体 key 路径由部署配置注入，待确认是否与 /config/version 相同
    source: vi-assets/qa-server-master/utils/etcd.py
  - name: ETCD_CONFIG.rule_key
    type: 版本通知
    ttl: 无
    writer: qa-server
    reader: qa-server
    purpose: 质检规则变更
    source: vi-assets/qa-server-master/utils/etcd.py
  - name: ETCD_CONFIG.number_key
    type: 版本通知
    ttl: 无
    writer: qa-server
    reader: vi-as
    purpose: 号码报备变更。qa-server 自己不监听。是否就是 /config/num/version 待确认
    source: vi-assets/qa-server-master/apps/vi/views.py
  - name: /vi-media/audio-capture
    type: 配置
    ttl: 无
    writer: ops-platform
    reader: vi-media
    purpose: 放音文件名列表，变更时重载缓存
    source: vi-assets/vi-media-master/internal/proxy/rtp.go
  - name: /{cluster}/micro-registry/{app}/{instance}
    type: 服务注册
    ttl: 租约，媒体侧约 30 秒并续约
    writer: vi-media, vi-merge, offline-merge
    reader: vi-as, vi-media, vi-merge, offline-merge
    purpose: 注册与发现。cluster 生产为 vii。应用名包括 com.cmic.vi.media、com.cmic.vi.merge、com.cmic.vi.offline、com.cmic.vi.mdownload
    source: vi-assets/vi-media-master/internal/pkg/kv/registry/registry.go
  - name: xdiscovery:{service}
    type: 服务注册
    ttl: 由 xdiscovery 库决定
    writer: vi-as, vi-billcenter, vi-pusher
    reader: vi-as, vi-billcenter, vi-pusher
    purpose: Java 服务注册。服务名 com.cmic.vi.pusher、com.cmic.vi.billcenter，以及 httpproxy、com.cmic.vi.strategy、com.cmic.xsipproxy。key 前缀格式待确认
    source: vi-assets/vi-as-master/src/main/java/com/cmic/service/MyRegistryService.java
