meta:
  id: data-redis-keys
  title: Redis Key
  domain: data
  kind: dynamic
  audience: [developer, ops, qa]
  owner: TODO
  status: draft
  last_verified: 2026-10-15
  source_of_truth:
    - vi-assets/vi-cront-jobs-master/
    - vi-assets/qa-server-master/apps/
    - vi-assets/scheduler-master/src/main/java/com/cmic/service/RedisService.java
    - vi-assets/vi-as-master/src/main/java/com/cmic/util/SessionLimitUtil.java
  related: [mn-traffic-control-overview, qc-orchestration, data-overview]

# 不写实例地址、库号和密码。号码用占位符。
# vi-as 的 Jedis 客户端未初始化，AB- 与 max_call_limit_ 在当前启动路径上不生效。
keys:
  - name: "highfreq-{caller}"
    type: string
    ttl: control_valid_second；小于等于 0 时不过期
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 短时高频命中。appendReason 5
    source: vi-assets/vi-cront-jobs-master/viStrategyHighFrequency.py
  - name: "difarea-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 异地大范围。appendReason 21
    source: vi-assets/vi-cront-jobs-master/viStrategyRemoteRange.py
  - name: "offtime-{customerId}"
    type: string
    ttl: 无，停用后由清理脚本删除
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 非工作时间。value 含 curfew。appendReason 13
    source: vi-assets/vi-cront-jobs-master/viStrategyOffwork.py
  - name: "threshold-{customerId}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 企业外呼门限。appendReason 20
    source: vi-assets/vi-cront-jobs-master/viStrategyBusinessThreshold.py
  - name: "bizrange-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 超业务范围。appendReason 22 盲呼 / 23 短秒率 / 24 接通率
    source: vi-assets/vi-cront-jobs-master/viStrategyBusinessRange.py
  - name: "longcall-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 长通话。appendReason 25
    source: vi-assets/vi-cront-jobs-master/viStrategyLongCall.py
  - name: "province-highfreq-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 外省大范围高频。appendReason 26
    source: vi-assets/vi-cront-jobs-master/viStrategyDifareaHighFreq.py
  - name: "city-highfreq-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 外市大范围高频。appendReason 27
    source: vi-assets/vi-cront-jobs-master/viStrategyDifareaHighFreq.py
  - name: "inactive-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 沉默号码话务突增。appendReason 28
    source: vi-assets/vi-cront-jobs-master/viStrategySilentCallBurst.py
  - name: "idle-highfreq-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 闲时高频。appendReason 29
    source: vi-assets/vi-cront-jobs-master/viStrategyIdleHighFreq.py
  - name: "short-highfreq-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 短时高频突增。appendReason 30
    source: vi-assets/vi-cront-jobs-master/viStrategyShortHighfreqBurst.py
  - name: "short-longcall-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 短时长通话突增。appendReason 31
    source: vi-assets/vi-cront-jobs-master/viStrategyShortLongcallBurst.py
  - name: "inactive-difarea-longcall-{caller}"
    type: string
    ttl: control_valid_second
    writer: vi-cront-jobs
    reader: strategy-service
    purpose: 沉默号码外地长通话突增。appendReason 32
    source: vi-assets/vi-cront-jobs-master/viStrategySilentDifareaLongcall.py
  - name: "QASERVER:WHITEIP"
    type: set
    ttl: 无
    writer: qa-server
    reader: qa-server
    purpose: 来源 IP 白名单。通配命中后会把精确 IP 写回集合
    source: vi-assets/qa-server-master/apps/__init__.py
  - name: "QASERVER:WHITEURL"
    type: set
    ttl: 无
    writer: qa-server
    reader: qa-server
    purpose: 回调 URL 白名单
    source: vi-assets/qa-server-master/apps/__init__.py
  - name: "AIQC_REQUEST_{requestId}"
    type: string
    ttl: 120s
    writer: qa-server
    reader: qa-server
    purpose: 建任务去重。NX 失败返回 1001
    source: vi-assets/qa-server-master/utils/helpers.py
  - name: "{taskId}:{dataId}"
    type: string
    ttl: 50h
    writer: qa-server
    reader: qa-server
    purpose: 子任务上下文
    source: vi-assets/qa-server-master/apps/service.py
  - name: "QARULE:{taskId}"
    type: string
    ttl: 50h
    writer: qa-server
    reader: qa-server
    purpose: 任务规则快照
    source: vi-assets/qa-server-master/apps/service.py
  - name: "{taskId}"
    type: string
    ttl: 无
    writer: qa-server
    reader: qa-server
    purpose: 准实时任务标记。无 TTL，需关注残留
    source: vi-assets/qa-server-master/apps/task_consumer.py
  - name: "QASUBRESULT:{yyyyMMddHHmm}"
    type: list
    ttl: 入库成功后删除
    writer: qa-server
    reader: qa-server
    purpose: 普通质检明细分钟桶，随后 stream load 到海山
    source: vi-assets/qa-server-master/apps/sub_worker.py
  - name: "VIQASUBRESULT:{yyyyMMddHHmm}"
    type: list
    ttl: 入库成功后删除
    writer: qa-server
    reader: qa-server
    purpose: 专线分片明细分钟桶
    source: vi-assets/qa-server-master/apps/sub_worker.py
  - name: "DCCQASUBRESULT:{yyyyMMddHHmm}"
    type: list
    ttl: 入库成功后删除
    writer: qa-server
    reader: qa-server
    purpose: 700 话单质检明细分钟桶
    source: vi-assets/qa-server-master/apps/sub_worker.py
  - name: "QAFAIL:retry:lock"
    type: string
    ttl: 600s，持有期间续期
    writer: qa-server
    reader: qa-server
    purpose: 专线失败重试的分布式锁
    source: vi-assets/qa-server-master/apps/retry_worker.py
  - name: "{dataId}"
    type: string
    ttl: 默认 7 天
    writer: scheduler
    reader: scheduler
    purpose: 裸 dataId，值为 1。标记 ASR 结果可复用。无前缀，避免与其它 key 冲突
    source: vi-assets/scheduler-master/src/main/java/com/cmic/service/ai/ASRService.java
  - name: "attrs_callback{jobId}"
    type: hash
    ttl: 3 天，每次写入重置
    writer: scheduler
    reader: scheduler
    purpose: 子任务回调属性。riskLevel 只升不降。回调后删除
    source: vi-assets/scheduler-master/src/main/java/com/cmic/service/AttributeService.java
  - name: "attrs_callId{callId}"
    type: hash
    ttl: 1 天
    writer: scheduler
    reader: scheduler
    purpose: 同一通话跨分片属性，例如 interruptShard
    source: vi-assets/scheduler-master/src/main/java/com/cmic/engine/condition/RedisCondition.java
  - name: "AB-{caller}-{callee}"
    type: string
    ttl: 代码设置了 TTL
    writer: vi-as
    reader: vi-as
    purpose: 主被叫对次数限制。当前 initRedis 未调用，不生效
    source: vi-assets/vi-as-master/src/main/java/com/cmic/util/SessionLimitUtil.java
  - name: "max_call_limit_{customerId}"
    type: hash
    ttl: 约 2 小时清理
    writer: vi-as
    reader: vi-as
    purpose: 客户并发限制。当前不生效，原因同上
    source: vi-assets/vi-as-master/src/main/java/com/cmic/util/SessionLimitUtil.java
