    汇总后 INSERT。
  columns:
  - name: id
    type: UInt64
    nullable: false
    desc: 统计 id
  - name: mobile_id
    type: Int32
    nullable: false
    desc: 一级移动
  - name: channel_id
    type: Int32
    nullable: false
    desc: 二级移动
  - name: company_id
    type: Int32
    nullable: false
    desc: 三级企业
  - name: customer_id
    type: Int32
    nullable: false
    desc: 四级客户
  - name: stat_time
    type: DateTime
    nullable: false
    desc: 统计时间
  - name: strategy_name
    type: String
    nullable: false
    desc: 与明细同一套策略编号
  - name: control_dimension
    type: String
    nullable: false
    desc: 超范围维度
  - name: trigger_phone_num
    type: UInt32
    nullable: false
    desc: 触发号码数
  - name: trigger_count
    type: Int32
    nullable: false
    desc: 触发次数
  - name: create_time
    type: DateTime
    nullable: false
    desc: 创建时间
  - name: update_time
    type: DateTime
    nullable: false
    desc: 更新时间
  indexes:
  - name: order_by
    columns:
    - id
    unique: false
  - name: partition
    columns:
    - toYYYYMM(stat_time)
    unique: false
  readers:
  - vi-cront-jobs
  writers:
  - vi-cront-jobs
  retention: 按月分区。清理策略待确认。
