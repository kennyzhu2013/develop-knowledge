meta:
  id: table-mid-bussops-call-control
  title: call_control 话务管控明细与统计
  domain: data
  kind: dynamic
  audience:
  - developer
  - ops
  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/vi-cront-jobs-master/viStrategyDailyStatistics.py
  - vi-assets/vi-cront-jobs-master/viStrategyHighFrequency.py
  related:
  - data-overview
conflicts:
- 'CONFLICT: /tmp/vi/docs/话务管控策略表DDL.txt control_command 注释「1 告警 2 挂断」vs 策略表/Redis「0 拦截 1 放通 2 告警」。脚本
  _cmd_map 为 {0:0, 1:2, 2:1}，把表指令映射后再写入明细。'
- 'CONFLICT: 运行逻辑文档库名 mid_bussop vs 代码 mid_bussops.call_control_statistics。以代码库名 mid_bussops 为准。'
table:
  name: call_control_detail
  database: mid_bussops
  service: vi-cront-jobs
  description: ClickHouse MergeTree。话务策略命中明细。PARTITION BY toYYYYMM(trigger_time)，ORDER BY id。strategy_name
    在代码中扩展到 1–5、8–15，DDL 注释只到 8。
  columns:
  - name: id
    type: UInt64
    nullable: false
    desc: 管控 id，脚本用雪花生成
  - name: mobile_id
    type: Int32
    nullable: false
    desc: 一级移动
  - name: channel_id
    type: Int32
    nullable: false
    desc: 二级移动
  - name: company_id
    type: Int32
    nullable: false
    desc: 三级企业
  - name: customer_id
    type: Int32
    nullable: false
    desc: 四级客户
  - name: trigger_time
    type: DateTime
    nullable: false
    desc: 触发时间，分区键
  - name: control_subjects
    type: String
    nullable: false
    desc: 管控对象，号码或企业
  - name: strategy_id
    type: UInt32
    nullable: false
    desc: 策略表 id
  - name: strategy_name
    type: String
    nullable: false
    desc: 1 短时高频，2 异地，3 非工作时间，4 超门限，5 超范围，8 长通话，9 外省高频，10 外市高频，11 沉默突增，12 闲时高频，13 短时高频突增，14 短时长突增，15 沉默外地长通话
  - name: control_dimension
    type: String
    nullable: false
    desc: 超范围维度：5 盲呼，6 短秒率，7 接通率。其它策略为空
  - name: control_command
    type: String
    nullable: false
    desc: 明细注释 1 告警 2 挂断。与策略表 0/1/2 经映射写入
  - name: threshold_config
    type: String
    nullable: false
    desc: 配置阈值
  - name: actual_value
    type: String
    nullable: false
    desc: 实际值
  - name: create_time
    type: DateTime
    nullable: false
    desc: 创建时间
  - name: update_time
    type: DateTime
    nullable: false
    desc: 更新时间
  indexes:
  - name: order_by
    columns:
    - id
    unique: false
  - name: partition
    columns:
    - toYYYYMM(trigger_time)
    unique: false
  readers:
  - vi-cront-jobs
  writers:
  - vi-cront-jobs
  retention: 按月分区。删除策略不在应用代码中，待确认。
