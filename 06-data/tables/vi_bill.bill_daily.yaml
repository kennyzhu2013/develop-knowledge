  title: bill_yyyy_MM_dd 按日话单
  domain: data
  kind: dynamic
  audience:
  - developer
  - ops
  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/vi-billcenter-master/src/main/java/com/cmic/dao/BillHistoryDao.java
  - vi-assets/vi-pusher-master/src/main/java/com/cmic/dao/BillHistoryDao.java
