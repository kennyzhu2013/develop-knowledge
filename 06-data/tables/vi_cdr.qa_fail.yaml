  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/qa-server-master/models.py
  - vi-assets/qa-server-master/apps/result_consumer.py
  - vi-assets/qa-server-master/apps/retry_worker.py
  related:
