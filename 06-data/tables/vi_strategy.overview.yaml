- name: active_phone_tab
  database: vi_strategy
  service: vi-cront-jobs
  description: 号码活跃时间。viStrategyActivePhone.py 按报备号码插入 biz_number、customer_id、online_time、active_time，沉默类策略读取。
  columns:
  - biz_number
  - customer_id
  - online_time
  - active_time
  readers:
  - vi-cront-jobs
  writers:
  - vi-cront-jobs
  retention: 脚本会统计 active_time 晚于 online_time 的行。清理策略待确认。
notes:
- apps/models.py 还声明 complaint_detail、strategy_detail、control_frequency_threshold、strategy_info、complaint_gzh_detail，挂在策略库
