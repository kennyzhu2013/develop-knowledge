conflicts:
- 'CONFLICT: /tmp/vi/analysis/docs.md 第 6.3 节曾记策略 7–13 无表无脚本 vs vi-assets/vi-cront-jobs-master：外省/外市高频、沉默突增、闲时高频、短时高频突增、短时长突增、沉默外地长通话六张表和对应脚本已在仓库中，设计
  DDL 仍只有前 6 张。'
summary: vi_strategy 中脚本真实读取的表超过 8 张。前 6 张有 DDL 的表各自一文件。本文件合并无独立 DDL 的 6 张策略表和 active_phone_tab。列类型除能从
  SQL 看出的名字外标为未知。主写入服务均为 vi-cront-jobs；策略配置表在本仓库只读，active_phone_tab 由 viStrategyActivePhone.py 写入。
tables:
- name: strategy_difarea_high_frequency
  database: vi_strategy
  service: vi-cront-jobs
  description: 外省/外市大范围高频。effect_area 1 写 province-highfreq-{caller} 且 appendReason 26，2 写 city-highfreq-{caller}
    且 appendReason 27。strategy_name 入明细时对应 9/10。
  columns:
  - id
  - strategy_name
  - customer_id
  - effect_area
  - effect_object
  - stat_cycle_second
  - call_threshold
  - area_ratio_threshold
  - control_valid_second
  - control_command
  - append_reason
  - status
  - effect_time
  - create_time
  - update_time
  readers:
  - vi-cront-jobs
  writers: []
  retention: 配置数据。列类型无 DDL，待确认。
- name: strategy_silent_call_burst
  database: vi_strategy
  service: vi-cront-jobs
  description: 沉默号码话务突增。Redis inactive-{caller}，appendReason 28。读取 active_phone_tab 判断沉默。无 is_main。
