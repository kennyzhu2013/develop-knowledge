meta:
  id: table-starrocks-qa-detail
  title: qa_detail 质检明细（海山）
  domain: data
  kind: dynamic
  audience:
  - developer
  - ops
  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/qa-server-master/models.py
  - vi-assets/qa-server-master/apps/sub_worker.py
  - vi-assets/scheduler-master/src/main/java/com/cmic/dao/QaDetailDaoImpl.java
  related:
  - data-overview
conflicts:
- 'CONFLICT: scheduler 日志仍写 ck error，数据源配置名 starRocks；qa-server 用 Stream Load 引擎 mid_strategy 写 qa_detail，失败兜底
  mid_strategy_hs。scheduler JDBC 库名在缺失的 application.yml 中，是否与 mid_strategy 同一库待确认。'
table:
  name: qa_detail
  database: mid_strategy
  service: qa-server
  description: 海山（StarRocks）质检子任务明细。普通结果从 Redis QASUBRESULT 经 Stream Load 写入引擎 mid_strategy；700 同名表写入引擎
    dcc_strategy（模型 DccQaDetail）。Redis 失败时直写 mid_strategy_hs 或 dcc_strategy_hs。scheduler 只读 id/url/content/duration/asr_info
    与 data_id/content/duration/asr_info/create_time，用于 ASR 复用。
  columns:
  - name: id
    type: Int64
    nullable: false
    desc: 记录 id
  - name: create_time
    type: DateTime
    nullable: false
    desc: 创建时间
  - name: finish_time
    type: DateTime
    nullable: false
    desc: 完成时间
  - name: task_id
    type: String
    nullable: false
    desc: 任务 id
  - name: data_id
    type: String
    nullable: false
    desc: 录音或子任务 id
  - name: app_id
    type: String
    nullable: false
    desc: 渠道
  - name: qa_customer_id
    type: Int32
    nullable: true
    desc: 终端客户
  - name: caller
    type: String
    nullable: false
    desc: 主叫
  - name: callee
    type: String
    nullable: false
    desc: 被叫
  - name: status
    type: String
    nullable: false
    desc: 1 成功，0 失败，3 重试中
  - name: qc_result
    type: String
    nullable: false
    desc: 0 异常，1 正常
  - name: risk_level
    type: String
    nullable: false
    desc: 风险等级
  - name: qa_type
    type: Int8
    nullable: false
    desc: 1 普通，2 专线
  - name: duration
    type: Int64
    nullable: false
    desc: 录音时长
  - name: url
    type: String
    nullable: false
    desc: 录音地址
  - name: content
    type: String
    nullable: false
    desc: ASR 文本
  - name: asr_info
    type: String
    nullable: false
    desc: ASR 详情。scheduler 复用时读取
  - name: process_id
    type: String
    nullable: false
    desc: 调度流程
  - name: rule_id
    type: Int64
    nullable: true
    desc: 规则 id
  - name: ctrl_action
    type: String
    nullable: false
    desc: 专线管控指令，来自 qa_strategy_config.control_action
  - name: audio_code
    type: String
    nullable: false
    desc: 放音编码。control_action=2 时清空
  - name: audio_direction
    type: String
    nullable: false
    desc: 放音对象
  - name: control_type
    type: String
    nullable: false
    desc: 管控类型
  - name: is_segment
    type: Int64
    nullable: true
    desc: 是否分片
  - name: segment_id
    type: Int64
    nullable: true
    desc: 分片 id
  - name: is_stream
    type: Int64
    nullable: true
    desc: 是否实时流
  - name: end_flag
    type: Int64
    nullable: true
    desc: 1 结束片
  - name: user_data
    type: String
    nullable: false
    desc: 专线透传
  - name: model_status
    type: String
    nullable: false
    desc: 各模型执行情况
  - name: error_message
    type: String
    nullable: false
    desc: 错误信息
  indexes: []
  readers:
  - qa-server
  - scheduler
  writers:
  - qa-server
  retention: 待确认。应用内无删除。
notes:
- 其余模型结果列见 models.py QaDetailBase 与 QaDetail 扩展列（关键词、场景、融通、BGE、重庆反诈等）。本文件不超过 40 列。
- DccQaDetail 另有 dcc_mobile_id、dcc_channel_id、dcc_platform_id、dcc_user_id、dcc_app_id、dcc_scene、is_media_channel_reversed。
