meta:
  id: table-user-qc-mobile-tab
  title: mobile_tab 一级移动
  domain: data
  kind: dynamic
  audience:
  - developer
  - ops
  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/qa-server-master/models.py
  - vi-assets/qa-server-master/utils/cache.py
  related:
