meta:
  id: table-user-qc-enterprise-scene
  title: enterprise_scene 场景词包
  domain: data
  kind: dynamic
  audience:
  - developer
  - ops
  - qa
  owner: TODO
  status: draft
  last_verified: '2026-10-15'
  source_of_truth:
  - vi-assets/qa-server-master/models.py
  - vi-assets/qa-server-master/apps/service.py
  related:
