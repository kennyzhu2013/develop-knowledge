table:
  name: chinamobile_icscf_ip
  database: user_qc
  service: vi-as
  description: 70014 前缀路由下，用 Via 中的 ICSCF 地址确定主叫区号。vi-as 只读 ip、center_area_code、province。contact_name
    与 phone 是联系人信息，禁止写入知识库样例或日志。本仓库无写入。
  columns:
  - name: id
    type: bigint
    nullable: false
    desc: 主键
  - name: province
    type: varchar(20)
    nullable: false
    desc: 省份
  - name: cscf_name
    type: varchar(60)
    nullable: false
    desc: CSCF 名称。vi-as 查询未选取
  - name: ip
    type: varchar(50)
    nullable: false
    desc: ICSCF 地址，IPv4 或 IPv6。文档不记录真实地址
  - name: contact_name
    type: varchar(50)
    nullable: false
    desc: 联系人。个人信息，不摘录
  - name: phone
    type: varchar(50)
    nullable: false
    desc: 联系电话。个人信息，不摘录
  - name: center_area_code
    type: varchar(5)
    nullable: true
    desc: 省会区号。长度短于号段表的 varchar(10)
  indexes:
  - name: PRIMARY
    columns:
    - id
    unique: true
  readers:
  - vi-as
  writers: []
  retention: 配置数据。刷新 key：/config/china_mobile_icscf/version 与 /config/chinamobile_icscf_areacode_version。
